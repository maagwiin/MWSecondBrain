[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mwsecondbrain"
version = "0.1.0"
description = "Personal vault controller and secure editing gateway"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "argon2-cffi>=23.1,<26"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
mwsb = "mwsecondbrain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mwsecondbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
